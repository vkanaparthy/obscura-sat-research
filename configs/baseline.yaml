name: lgb_baseline
data_dir: null              # null = auto (data/raw, $OBSCURA_DIR, or /kaggle/input)
output_dir: outputs
image_cache: outputs/cache/img_feats.csv
use_image_features: true
seed: 42
n_folds: 5
early_stopping: 100
mean_fallback: true         # use train mean for targets where LightGBM loses in CV

lgb_params:
  objective: regression
  learning_rate: 0.03
  num_leaves: 15
  min_child_samples: 40
  feature_fraction: 0.6
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 5.0
  n_estimators: 2000
